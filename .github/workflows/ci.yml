name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?options=-c%20role%3Dcreatordrop_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase PostgreSQL and Auth
        run: npm run db:start

      - name: Check workspace boundaries
        run: npm run check:workspaces

      - name: Check deterministic RNG vectors
        run: npm run check:rng-vectors

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate SQL migrations from empty
        run: npm run db:migrations:validate

      - name: Run PostgreSQL and Supabase Auth integration tests
        run: npm run test:integration

      - name: Build all applications and packages
        run: npm run build

      - name: Scan tracked content for secrets
        run: npm run secrets:scan

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
